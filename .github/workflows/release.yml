name: Release

# Builds, tests and packages the exact commit on every platform (through
# ci.yml), writes release.toml in the schema eov's installer reads, and
# publishes a GitHub Release only once every asset is verified.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (must match Cargo.toml and plugin.toml)"
        required: true
        type: string
      eov_ref:
        description: "eov revision to build against"
        default: master
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate the source
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      eov_sha: ${{ steps.meta.outputs.eov_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Versions agree and the tag is free
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EOV_REF: ${{ inputs.eov_ref }}
        run: |
          set -euo pipefail
          python3 scripts/release.py validate-source --version "$VERSION"
          tag="v$VERSION"
          if git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null; then
            echo "tag $tag already exists" >&2
            exit 1
          fi
          eov_sha="$(gh api "repos/eosin-platform/eov/commits/$EOV_REF" --jq .sha)"
          {
            echo "tag=$tag"
            echo "eov_sha=$eov_sha"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and test
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      eov_ref: ${{ needs.prepare.outputs.eov_sha }}
      version: ${{ inputs.version }}

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cellaris-*
          path: artifacts
      - name: Stage the packages and write release.toml
        run: |
          set -euo pipefail
          python3 scripts/release.py manifest --version "$VERSION" \
            --artifacts-dir artifacts --staging-dir release-files \
            --output release-files/release.toml
          ls -l release-files
      - name: Create a draft release at this commit
        run: |
          set -euo pipefail
          gh release create "$TAG" --target "$GITHUB_SHA" --draft \
            --title "Cellaris $VERSION" \
            --notes "Predicted multiplex-IF markers for eov. Research use only: predictions are not measurements and are not for diagnosis. Packages bundle ONNX Runtime with its licence and notices, except macOS x86_64 (install it with Homebrew). The marker model is not included; see the README." \
            release-files/*
      - name: The draft holds exactly the staged files
        run: |
          set -euo pipefail
          expected="$(find release-files -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
      - name: Publish
        run: gh release edit "$TAG" --draft=false
      - name: The published assets match release.toml
        run: python3 scripts/release.py verify-assets --version "$VERSION" --manifest release-files/release.toml
