[package]
name = "cellaris"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Predicted Orion multiplex-IF markers overlaid on H&E in eov (research use only, not for diagnosis)"
repository = "https://github.com/eosin-platform/eov-cellaris-plugin"
license = "MIT OR Apache-2.0 OR GPL-3.0"
publish = false

# A workspace of its own, so it builds inside an eov checkout
# (`cargo build --manifest-path plugins/cellaris/Cargo.toml`) as well as on
# its own next to one.
[workspace]

[lib]
# The library must be named after the plugin id: libcellaris.so,
# libcellaris.dylib or cellaris.dll.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Not on crates.io yet: built from the eov checkout this plugin sits in.
eov-plugin-api = { path = "../../plugin_api", version = "1.0" }
# A pre-release, so pinned exactly. `load-dynamic` finds ONNX Runtime at run
# time; `api-17` accepts any ONNX Runtime from 1.17 on.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-17"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
semver = "1"

[profile.release]
opt-level = 3
