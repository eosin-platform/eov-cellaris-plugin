[package]
name = "cellaris"
version = "0.1.0"
edition = "2021"
description = "Predicted Orion multiplex-IF markers overlaid on H&E, as an EOV viewport filter"
repository = "https://github.com/eosin-platform/eov-cellaris-plugin"
license = "Apache-2.0 OR MIT OR GPL-3.0-or-later"

[features]
default = ["export-vtable-symbol"]
export-vtable-symbol = []

[lib]
crate-type = ["cdylib", "rlib"]

# plugin_api only needs abi_stable, serde, toml and thiserror, so EOV does not
# have to be checked out and nothing here links openslide.
[dependencies]
abi_stable = "0.11"
ndarray = "0.17"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "api-24", "load-dynamic"] }
plugin_api = { git = "https://github.com/eosin-platform/eov.git", tag = "v0.3.1" }

[profile.release]
opt-level = 3
